<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Atlantys — a public agent registry beneath the surface.">
  <title>Atlantys — Public Agent Registry</title>
  <link rel="preconnect" href="https://rickandmortyapi.com">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%2397ce4c' d='M16 2C8.6 2 2.4 7.7 2 15c-.4 7.6 5.4 14.1 13 14.8 7.8.7 14.7-5 15-12.8.4-7.3-4.8-13.8-12-14.8L16 2Zm0 6a8 8 0 1 1 0 16 8 8 0 0 1 0-16Z'/></svg>">
</head>
<body class="world world--atlantys">
  <a class="skip-link" href="#registry">Skip to the registry</a>
  <canvas id="ambientCanvas" aria-hidden="true"></canvas>
  <div class="world-texture" aria-hidden="true"></div>

  <div class="cable-ticker" id="ticker" aria-label="Interdimensional Cable Atlantys package ticker"></div>
  <header class="world-nav" id="worldNav"></header>

  <main id="scenarioRoot" tabindex="-1" aria-live="polite"></main>

  <div class="portal-entrance" id="portalEntrance" aria-hidden="true">
    <div class="portal-entrance__destination" aria-hidden="true"></div>
    <div class="portal-entrance__gate" aria-hidden="true">
      <span class="portal-entrance__receiver">CURRENT LOCKED / ATLANTYS</span>
      <img class="portal-entrance__loop" src="./assets/portal-show-loop-12fps-480.webp" alt="">
      <img class="portal-entrance__poster" src="./assets/portal-show-poster.webp" alt="">
      <span class="portal-entrance__fallback">
        <i></i><i></i><i></i>
      </span>
    </div>
    <button class="portal-entrance__skip" type="button" data-skip-intro>Skip intro</button>
  </div>

  <div class="load-layer" id="loadLayer" aria-live="polite">
    <div class="character-task character-task--butter" id="butterTask"></div>
  </div>

  <div class="state-layer" id="stateLayer" aria-live="assertive"></div>
  <div class="manifest-drawer" id="manifestDrawer" aria-hidden="true"></div>
  <div class="confirm-stack" id="confirmStack" aria-live="polite"></div>

  <noscript>
    <div class="noscript">Atlantys needs JavaScript to read the package manifests.</div>
  </noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
